name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docflow
          POSTGRES_PASSWORD: docflow
          POSTGRES_DB: docflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docflow -d docflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://docflow:docflow@localhost:5432/docflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            ocr_service/requirements.txt
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt -r ocr_service/requirements.txt
      - name: Lint
        run: make lint
      - name: Type check
        run: make typecheck
      - name: Test with real PostgreSQL and pgvector
        run: make test
